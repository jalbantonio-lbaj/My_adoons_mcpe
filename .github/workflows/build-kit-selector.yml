name: Build Kit Selector addon
on:
  push:
    branches:
      - feature/kit-selector-menu
    paths:
      - "Kit TC OP/**"
      - ".github/workflows/build-kit-selector.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and pack linkage
        shell: bash
        run: |
          set -euo pipefail
          BP="Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack"
          RP="Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack"
          test -f "$BP/scripts/commands/kit_preview.js"
          test -f "$BP/scripts/commands/kitop.js"
          test -f "$BP/scripts/commands/kitn.js"
          test -f "$BP/scripts/main.js"
          python - <<'PY'
          import json
          from pathlib import Path
          bp=Path("Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack")
          rp=Path("Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack")
          bm=json.loads((bp/"manifest.json").read_text())
          rm=json.loads((rp/"manifest.json").read_text())
          assert bm["header"]["version"] == [1,3,0]
          assert rm["header"]["version"] == [1,3,0]
          assert bm["modules"][0]["version"] == rm["modules"][0]["version"] == [1,3,0]
          assert any(d.get("uuid")==rm["header"]["uuid"] and d.get("version")==[1,3,0] for d in bm["dependencies"])
          main=(bp/"scripts/main.js").read_text()
          preview=(bp/"scripts/commands/kit_preview.js").read_text()
          kitop=(bp/"scripts/commands/kitop.js").read_text()
          assert 'startKitPreview(player, "KitOP")' in main
          assert 'startKitPreview(player, "KitN")' in main
          for command in ("tc:preview_lock","tc:preview_confirm","tc:preview_cancel","tc:preview_rotate_left","tc:preview_rotate_right"):
              assert f'name: "{command}"' in main
          assert "spawnParticle" in preview and "locked" in preview
          assert "handleKitOp({ sourceEntity: player }, { anchor: session.anchor, rotation: session.rotation })" in preview
          assert "anchorOverride" in kitop
          assert "startKitNPreview" not in main
          print("Ghost preview wiring and pack linkage passed.")
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          BP="Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack"
          for file in "$BP"/scripts/main.js "$BP"/scripts/commands/*.js "$BP"/scripts/core/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Test placement planner
        run: node --experimental-default-type=module --test "Kit TC OP/tests/placement-plan.test.mjs"
      - name: Package addon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd "Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack" && zip -qr "$GITHUB_WORKSPACE/dist/TC_KitOP_BP_v1.3.0.mcpack" .)
          (cd "Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack" && zip -qr "$GITHUB_WORKSPACE/dist/TC_KitOP_RP_v1.3.0.mcpack" .)
          cd dist
          zip -q TC_KitOP_Kit_Selector_v1.3.0.mcaddon TC_KitOP_BP_v1.3.0.mcpack TC_KitOP_RP_v1.3.0.mcpack
          unzip -t TC_KitOP_Kit_Selector_v1.3.0.mcaddon
      - uses: actions/upload-artifact@v4
        with:
          name: TC_KitOP_Kit_Selector_v1.3.0
          path: dist/TC_KitOP_Kit_Selector_v1.3.0.mcaddon
          if-no-files-found: error
          retention-days: 30
