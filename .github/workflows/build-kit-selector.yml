name: Build Kit Selector addon
on:
  push:
    branches:
      - feature/kit-selector-menu
    paths:
      - "Kit TC OP/**"
      - "Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack/**"
      - ".github/workflows/build-kit-selector.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate pack sources
        shell: bash
        run: |
          set -euo pipefail
          test -f "Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack/manifest.json"
          test -f "Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack/scripts/main.js"
          test -f "Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack/items/kit_selector.json"
          test -f "Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack/manifest.json"
          test -f "Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack/textures/item_texture.json"
          test -f "Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack/textures/items/kit_selector.png"
      - name: Package mcpack and mcaddon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd "Kit TC OP/TC_KitOP_BP_v1.1.0.mcpack" && zip -qr "$GITHUB_WORKSPACE/dist/TC_KitOP_BP_v1.1.1.mcpack" .)
          (cd "Kit TC OP/TC_KitOP_RP_v1.1.1.mcpack" && zip -qr "$GITHUB_WORKSPACE/dist/TC_KitOP_RP_v1.1.1.mcpack" .)
          cd dist
          zip -q TC_KitOP_Kit_Selector_v1.1.1.mcaddon TC_KitOP_BP_v1.1.1.mcpack TC_KitOP_RP_v1.1.1.mcpack
          unzip -t TC_KitOP_Kit_Selector_v1.1.1.mcaddon
          unzip -l TC_KitOP_Kit_Selector_v1.1.1.mcaddon
      - uses: actions/upload-artifact@v4
        with:
          name: TC_KitOP_Kit_Selector_v1.1.1
          path: dist/TC_KitOP_Kit_Selector_v1.1.1.mcaddon
          if-no-files-found: error
          retention-days: 30
